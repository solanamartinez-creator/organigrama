<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organigrama Universidad Atlántida - Modo Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .canvas-grid { 
            background-size: 24px 24px; 
            background-image: radial-gradient(circle, #cbd5e1 1.2px, transparent 1.2px); 
        }
        
        /* OBLIGAR A MOSTRAR LA BARRA SI O SÍ Y DARLE UN DISEÑO LLAMATIVO */
        .fuerza-scroll {
            overflow-x: scroll !important; /* Fuerza la aparición de la barra horizontal */
            overflow-y: auto;
        }
        .fuerza-scroll::-webkit-scrollbar {
            height: 14px; /* Un poco más gruesa para que sea fácil de agarrar */
        }
        .fuerza-scroll::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 10px;
        }
        .fuerza-scroll::-webkit-scrollbar-thumb {
            background: #a6b9d0;
            border-radius: 10px;
            border: 3px solid #e2e8f0;
        }
        .fuerza-scroll::-webkit-scrollbar-thumb:hover {
            background: #224289; /* Se vuelve azul cuando le pasás el mouse por arriba */
        }
        
        /* Cursor de mano para arrastrar */
        .grab-canvas { cursor: grab; }
        .grab-canvas:active { cursor: grabbing; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden" onload="initOrganigrama()">

    <section class="bg-white border-b border-slate-200 py-3.5 px-6 shadow-sm sticky top-0 z-30">
        <div class="max-w-[1700px] mx-auto flex flex-col lg:flex-row justify-between items-center gap-4">
            
            <div class="flex flex-col md:flex-row items-center gap-4 w-full lg:w-auto">
                <div class="flex bg-slate-100 p-1 rounded-xl w-full md:w-auto">
                    <button id="tab-chart" onclick="switchView('chart')" class="flex-1 md:flex-none py-2 px-4 rounded-lg text-sm font-semibold bg-white text-[#224289] shadow-sm">
                        <i class="fa-solid fa-sitemap"></i> Vista de Árbol
                    </button>
                    <button id="tab-list" onclick="switchView('list')" class="flex-1 md:flex-none py-2 px-4 rounded-lg text-sm font-semibold text-slate-600">
                        <i class="fa-solid fa-table-list"></i> Vista de Planilla / Búsqueda
                    </button>
                </div>
                <button onclick="solicitarAccesoAdmin()" class="text-xs text-slate-400 hover:text-[#224289] font-medium transition">
                    <i class="fa-solid fa-lock">
