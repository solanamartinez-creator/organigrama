<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organigrama - Universidad Atlántida</title>
    <!-- Tailwind CSS para el diseño responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconografía corporativa -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .canvas-grid {
            background-size: 24px 24px;
            background-image: radial-gradient(circle, #cbd5e1 1.2px, transparent 1.2px);
            background-color: #f8fafc;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #224289;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden" onload="initOrganigrama()">

    <!-- Barra de Herramientas de Navegación -->
    <section class="bg-white border-b border-slate-200 py-3.5 px-6 shadow-sm sticky top-0 z-30">
        <div class="max-w-[1700px] mx-auto flex flex-col lg:flex-row justify-between items-center gap-4">
            
            <!-- Selector de Vistas y Breadcrumb -->
            <div class="flex flex-col md:flex-row items-center gap-4 w-full lg:w-auto">
                <div class="flex bg-slate-100 p-1 rounded-xl w-full md:w-auto">
                    <button id="tab-chart" onclick="switchView('chart')" class="flex-1 md:flex-none py-2 px-4 rounded-lg text-sm font-semibold transition duration-200 flex items-center justify-center gap-2 bg-white text-[#224289] shadow-sm">
                        <i class="fa-solid fa-sitemap"></i> Vista de Árbol
                    </button>
                    <button id="tab-list" onclick="switchView('list')" class="flex-1 md:flex-none py-2 px-4 rounded-lg text-sm font-semibold transition duration-200 flex items-center justify-center gap-2 text-slate-600 hover:text-slate-900">
                        <i class="fa-solid fa-table-list"></i> Vista de Planilla / Búsqueda
                    </button>
                </div>
                
                <!-- Indicador de Navegación -->
                <div class="flex items-center gap-2 text-xs font-semibold text-slate-500 bg-slate-50 px-3 py-2 rounded-xl border border-slate-200">
                    <span class="text-[#224289]"><i class="fa-solid fa-house"></i> Estructura Universitaria</span>
                </div>
            </div>

            <!-- Panel de Acciones Institucionales (Modo Consulta) -->
            <div class="flex flex-wrap items-center justify-center gap-2 w-full lg:w-auto">
                <button onclick="exportToCSV()" class="bg-[#224289] hover:bg-[#152e66] text-white text-xs font-bold py-2 px-3.5 rounded-lg transition-all flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-file-excel text-[#11caa0]"></i> Descargar Listado Excel
                </button>
                <div class="bg-indigo-50 border border-indigo-200 text-indigo-700 text-xs px-3 py-2 rounded-lg font-medium">
                    <i class="fa-solid fa-eye"></i> Vista Institucional de Solo Lectura
                </div>
            </div>

            <!-- Motor de Búsqueda Dinámica -->
            <div class="relative w-full lg:w-72">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Buscar puesto o personal..." class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 pl-10 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-[#224289] transition">
            </div>

            <!-- Widget de Cobertura -->
            <div class="flex items-center gap-3 bg-slate-50 border border-slate-200 py-2 px-4 rounded-xl text-xs font-semibold text-slate-700 w-full lg:w-auto justify-between shadow-sm">
                <span class="text-slate-500">Puestos Cubiertos:</span>
                <span id="progress-text" class="text-[#224289] font-bold">0/0</span>
            </div>
        </div>
    </section>

    <!-- Contenido Principal -->
    <main class="flex-1 p-6 max-w-[1700px] mx-auto w-full flex flex-col">
        
        <!-- Vista de Árbol Gráfico -->
        <div id="view-chart" class="flex-1 flex flex-col bg-slate-50 rounded-3xl border border-slate-200 shadow-inner p-6 min-h-[600px] canvas-grid justify-center items-center overflow-auto">
            <div id="dynamic-canvas-content" class="w-full flex flex-col items-center gap-8 animate-fade-in">
                <!-- Se dibuja acá automáticamente -->
            </div>
        </div>

        <!-- Vista de Planilla de Datos Completa -->
        <div id="view-list" class="hidden bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-md">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase tracking-wider">
                            <th class="py-4 px-6">Ubicación / Área</th>
                            <th class="py-4 px-6">Nombre del Puesto / Rol</th>
                            <th class="py-4 px-6">Apellido y Nombre</th>
                            <th class="py-4 px-6">Email Institucional</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-100 text-sm text-slate-700">
                        <!-- El cuerpo de la tabla se genera vía JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Footer Institucional -->
    <footer class="bg-white text-slate-400 text-center py-5 border-t border-slate-200 text-xs mt-auto">
        <p>© 2026 Universidad Atlántida Argentina - Consulta de Estructura Institucional de Personal.</p>
    </footer>

    <script>
        // Estructura de Datos Base Estática
        const generalStructure = {
            divisions: [
                { id: "div_delegados", name: "Sedes / Delegados" },
                { id: "div_secretarias", name: "Secretarías" },
                { id: "div_facultades", name: "Facultades" }
            ],
            nodes: {
                "consejo_superior": { name: "Consejo Superior", apellido: "Martínez", nombre: "Alberto", email: "amartinez@atlantida.edu.ar" },
                "rectorado": { name: "Rectorado (Rector/Vicerrector)", apellido: "Silva", nombre: "Eduardo", email: "esilva@atlantida.edu.ar" },
                
                // Sedes
                "del_mdp": { name: "Sede Mar del Plata", divisionId: "div_delegados", apellido: "Rossi", nombre: "Carolina", email: "crossi@atlantida.edu.ar" },
                "del_dolores": { name: "Sede Dolores", divisionId: "div_delegados", apellido: "Álvarez", nombre: "Fernando", email: "falvarez@atlantida.edu.ar" },
                "del_ajo": { name: "Sede Mar de Ajó", divisionId: "div_delegados", apellido: "Sánz", nombre: "Alicia", email: "asanz@atlantida.edu.ar" },
                
                // Secretarías
                "sec_academica": { name: "Secretaría Académica", divisionId: "div_secretarias", apellido: "Benítez", nombre: "Sofía", email: "sbenitez@atlantida.edu.ar" },
                "sec_investigacion": { name: "Secretaría de Investigación", divisionId: "div_secretarias", apellido: "López", nombre: "Carlos", email: "clopez@atlantida.edu.ar" },
                
                // Facultades
                "fac_ingenieria": { name: "Facultad de Ingeniería", divisionId: "div_facultades", apellido: "Gómez", nombre: "Raúl", email: "rgomez@atlantida.edu.ar" },
                "fac_derecho": { name: "Facultad de Derecho", divisionId: "div_facultades", apellido: "Fernández", nombre: "María", email: "mfernandez@atlantida.edu.ar" }
            }
        };

        function initOrganigrama() {
            renderTree();
            renderTable(Object.keys(generalStructure.nodes));
            updateMetrics();
        }

        function switchView(view) {
            const chartTab = document.getElementById('tab-chart');
            const listTab = document.getElementById('tab-list');
            const chartView = document.getElementById('view-chart');
            const listView = document.getElementById('view-list');

            if (view === 'chart') {
                chartView.classList.remove('hidden');
                listView.classList.add('hidden');
                chartTab.classList.add('bg-white', 'text-[#224289]', 'shadow-sm');
                listTab.classList.remove('bg-white', 'text-[#224289]', 'shadow-sm');
                listTab.classList.add('text-slate-600');
            } else {
                chartView.classList.add('hidden');
                listView.classList.remove('hidden');
                listTab.classList.add('bg-white', 'text-[#224289]', 'shadow-sm');
                chartTab.classList.remove('bg-white', 'text-[#224289]', 'shadow-sm');
                chartTab.classList.add('text-slate-600');
            }
        }

        function renderTree() {
            const content = document.getElementById('dynamic-canvas-content');
            
            const root = generalStructure.nodes["consejo_superior"];
            const rector = generalStructure.nodes["rectorado"];

            let html = `
                <div class="flex flex-col items-center w-full">
                    ${createCardHTML(root)}
                    <div class="w-0.5 h-6 bg-[#224289] my-1"></div>
                    ${createCardHTML(rector)}
                    <div class="w-0.5 h-6 bg-[#224289] my-1"></div>
                    
                    <!-- Contenedor Horizontal para Columnas -->
                    <div class="flex flex-col md:flex-row gap-6 justify-center items-start w-full mt-4 px-2">
            `;

            generalStructure.divisions.forEach(div => {
                html += `
                    <div class="flex flex-col bg-slate-100/80 p-4 rounded-2xl border border-slate-200 flex-1 min-w-[260px] gap-3 shadow-xs">
                        <div class="text-center font-bold text-xs text-[#224289] uppercase tracking-wider pb-2 border-b border-slate-200">${div.name}</div>
                `;

                Object.keys(generalStructure.nodes).forEach(id => {
                    const node = generalStructure.nodes[id];
                    if (node.divisionId === div.id) {
                        html += createCardHTML(node);
                    }
                });

                html += `</div>`;
            });

            html += `</div></div>`;
            content.innerHTML = html;
        }

        function createCardHTML(node) {
            return `
                <div class="bg-white border border-slate-200 p-4 rounded-xl shadow-sm w-full max-w-[260px] mx-auto transition hover:shadow-md">
                    <h4 class="text-xs font-bold text-slate-800">${node.name}</h4>
                    <p class="text-sm font-bold text-[#224289] mt-1">${node.apellido}, ${node.nombre}</p>
                    <p class="text-[10px] text-slate-400 truncate mt-0.5">${node.email}</p>
                </div>
            `;
        }

        function renderTable(nodeIds) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            nodeIds.forEach(id => {
                const node = generalStructure.nodes[id];
                let location = "Nivel Central";
                if (node.divisionId) {
                    const div = generalStructure.divisions.find(d => d.id === node.divisionId);
                    if (div) location = div.name;
                }

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="py-3 px-6 text-slate-500 text-xs font-medium">${location}</td>
                        <td class="py-3 px-6 font-bold text-slate-800 text-xs">${node.name}</td>
                        <td class="py-3 px-6 text-sm font-semibold text-[#224289]">${node.apellido}, ${node.nombre}</td>
                        <td class="py-3 px-6 text-xs text-slate-500">${node.email}</td>
                    </tr>
                `;
            });
        }

        function handleSearch(query) {
            if (!query.trim()) {
                renderTable(Object.keys(generalStructure.nodes));
                return;
            }
            const filteredIds = Object.keys(generalStructure.nodes).filter(id => {
                const node = generalStructure.nodes[id];
                return node.name.toLowerCase().includes(query.toLowerCase()) || 
                       (node.nombre + ' ' + node.apellido).toLowerCase().includes(query.toLowerCase());
            });
            switchView('list');
            renderTable(filteredIds);
        }

        function updateMetrics() {
            const total = Object.keys(generalStructure.nodes).length;
            document.getElementById('progress-text').innerText = `${total}/${total}`;
        }

        function exportToCSV() {
            let csv = "\uFEFFUbicación;Puesto;Personal;Email\n";
            Object.keys(generalStructure.nodes).forEach(id => {
                const node = generalStructure.nodes[id];
                let location = "Nivel Central";
                if (node.divisionId) {
                    const div = generalStructure.divisions.find(d => d.id === node.divisionId);
                    if (div) location = div.name;
                }
                csv += `"${location}";"${node.name}";"${node.apellido}, ${node.nombre}";"${node.email}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", "organigrama_universidad.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
