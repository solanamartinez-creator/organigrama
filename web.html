<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organigrama - Universidad Atlántida</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        #tree-container {
            user-select: none;
            cursor: grab;
        }
        #tree-container:active {
            cursor: grabbing;
        }
        .canvas-grid {
            background-size: 24px 24px;
            background-image: radial-gradient(circle, #cbd5e1 1.2px, transparent 1.2px);
            background-color: #f8fafc;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #224289;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        .connection-line {
            stroke: #224289;
            stroke-width: 2;
            fill: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden" onload="initOrganigrama()">

    <section class="bg-white border-b border-slate-200 py-3.5 px-6 shadow-sm sticky top-0 z-30 animate-fade-in">
        <div class="max-w-[1700px] mx-auto flex flex-col lg:flex-row justify-between items-center gap-4">
            
            <div class="flex flex-col md:flex-row items-center gap-4 w-full lg:w-auto">
                <div class="flex bg-slate-100 p-1 rounded-xl w-full md:w-auto">
                    <button id="tab-chart" onclick="switchView('chart')" class="flex-1 md:flex-none py-2 px-4 rounded-lg text-sm font-semibold transition duration-200 flex items-center justify-center gap-2 bg-white text-[#224289] shadow-sm">
                        <i class="fa-solid fa-sitemap"></i> Vista de Árbol
                    </button>
                    <button id="tab-list" onclick="switchView('list')" class="flex-1 md:flex-none py-2 px-4 rounded-lg text-sm font-semibold transition duration-200 flex items-center justify-center gap-2 text-slate-600 hover:text-slate-900">
                        <i class="fa-solid fa-table-list"></i> Vista de Planilla / Búsqueda
                    </button>
                </div>
                
                <div id="breadcrumbs" class="flex items-center gap-2 text-xs font-semibold text-slate-500 bg-slate-50 px-3 py-2 rounded-xl border border-slate-200 shadow-xs">
                    <span class="text-[#224289] cursor-pointer" onclick="navigateToLevel('general')"><i class="fa-solid fa-house"></i> General</span>
                    <span class="hidden" id="crumb-separator"><i class="fa-solid fa-chevron-right text-[10px]"></i></span>
                    <span class="text-slate-800 font-bold hidden" id="crumb-subdepartment">Subárea</span>
                </div>
            </div>

            <div class="flex flex-wrap items-center justify-center gap-2 w-full lg:w-auto">
                <button onclick="exportToCSV()" class="bg-[#224289] hover:bg-[#152e66] text-white text-xs font-bold py-2 px-3.5 rounded-lg transition-all flex items-center gap-2 shadow-sm" title="Descargar reporte completo en Excel">
                    <i class="fa-solid fa-file-excel text-[#11caa0]"></i> Descargar Listado Excel
                </button>
                <div class="bg-indigo-50 border border-indigo-200 text-indigo-700 text-xs px-3 py-2 rounded-lg font-medium">
                    <i class="fa-solid fa-eye"></i> Vista Institucional de Solo Lectura
                </div>
            </div>

            <div class="relative w-full lg:w-72">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Buscar puesto o personal..." class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 pl-10 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-[#224289] transition">
            </div>

            <div class="flex items-center gap-3 bg-slate-50 border border-slate-200 py-2 px-4 rounded-xl text-xs font-semibold text-slate-700 w-full lg:w-auto justify-between shadow-sm">
                <span class="text-slate-500">Puestos Cubiertos:</span>
                <div class="w-16 bg-slate-200 rounded-full h-2 overflow-hidden">
                    <div id="progress-bar" class="bg-[#11caa0] h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
                <span id="progress-text" class="text-[#224289] font-bold">0/0</span>
            </div>
        </div>
    </section>

    <main class="flex-1 p-6 max-w-[1700px] mx-auto w-full flex flex-col">
        
        <div id="department-banner" class="mb-6 bg-white border border-slate-200 border-l-4 border-[#224289] p-4 rounded-r-2xl shadow-sm flex items-center justify-between text-slate-800 animate-fade-in hidden">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center text-[#224289] border border-slate-200"><i class="fa-solid fa-graduation-cap"></i></div>
                <div>
                    <h2 id="banner-title" class="text-base font-bold text-slate-900">Área Específica</h2>
                    <p id="banner-subtitle" class="text-[11px] text-slate-500">Organigrama y personal interno de esta dependencia académica</p>
                </div>
            </div>
            <button onclick="navigateToLevel('general')" class="bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-semibold py-1.5 px-3.5 rounded-lg border border-slate-200 transition flex items-center gap-1.5 shadow-xs">
                <i class="fa-solid fa-arrow-left-long"></i> Volver a Nivel General
            </button>
        </div>

        <div id="view-chart" class="flex-1 flex flex-col bg-slate-50 rounded-3xl border border-slate-200 shadow-inner overflow-hidden min-h-[680px] relative">
            
            <div class="absolute top-4 left-4 z-20 bg-white p-2 rounded-2xl border border-slate-200 shadow-md flex items-center gap-1.5">
                <button onclick="adjustZoom(0.1)" class="w-9 h-9 bg-slate-50 hover:bg-[#224289] text-slate-600 hover:text-white rounded-xl flex items-center
