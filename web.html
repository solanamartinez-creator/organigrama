<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organigrama Interactivo - Universidad Atlántida Argentina</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        #tree-container { user-select: none; cursor: grab; }
        #tree-container:active { cursor: grabbing; }
        .canvas-grid {
            background-size: 24px 24px;
            background-image: radial-gradient(circle, #cbd5e1 1.2px, transparent 1.2px);
            background-color: #f8fafc;
        }
        .admin-only { display: none !important; }
        body.is-admin .admin-only { display: flex !important; }
        body.is-admin .admin-only-block { display: block !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">

    <!-- Barra de Herramientas Principal -->
    <section class="bg-white border-b border-slate-200 py-3.5 px-6 shadow-sm sticky top-0 z-30">
        <div class="max-w-[1700px] mx-auto flex flex-col lg:flex-row justify-between items-center gap-4">
            
            <div class="flex flex-col md:flex-row items-center gap-4 w-full lg:w-auto">
                <div class="flex bg-slate-100 p-1 rounded-xl">
                    <button id="tab-chart" onclick="switchView('chart')" class="py-2 px-4 rounded-lg text-sm font-semibold bg-white text-[#224289] shadow-sm">
                        <i class="fa-solid fa-sitemap"></i> Vista de Árbol
                    </button>
                    <button id="tab-list" onclick="switchView('list')" class="py-2 px-4 rounded-lg text-sm font-semibold text-slate-600 hover:text-slate-900">
                        <i class="fa-solid fa-table-list"></i> Lista Completa
                    </button>
                </div>
                
                <!-- Barra de Navegación por Niveles (Migas de Pan) -->
                <div id="breadcrumbs" class="flex items-center gap-2 text-xs font-semibold text-slate-500 bg-slate-50 px-3 py-2 rounded-xl border border-slate-200">
                    <span class="text-[#224289] cursor-pointer hover:underline" onclick="navigateToLevel('general')">
                        <i class="fa-solid fa-university"></i> Organigrama General
                    </span>
                </div>
            </div>

            <!-- Acciones de Datos Privadas / Modos de Edición -->
            <div class="flex flex-wrap items-center justify-center gap-2 w-full lg:w-auto">
                <button onclick="addNewDivisionPrompt()" class="admin-only bg-slate-50 hover:bg-slate-100 text-[#224289] text-xs font-bold py-2 px-3.5 rounded-lg border border-slate-200 shadow-xs">
                    <i class="fa-solid fa-circle-plus text-[#11caa0]"></i> + Nueva Sección
                </button>
                <button onclick="exportToJSON()" class="admin-only bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-semibold py-2 px-3 rounded-lg border border-slate-200">
                    <i class="fa-solid fa-file-export text-[#224289]"></i> Exportar Estructura
                </button>
                <label class="admin-only bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-semibold py-2 px-3 rounded-lg border border-slate-200 cursor-pointer">
                    <i class="fa-solid fa-file-import text-[#224289]"></i> Importar Estructura
                    <input type="file" id="import-file" class="hidden" onchange="importFromJSON(event)" accept=".json">
                </label>
                <button id="btn-login-status" onclick="promptAdminLogin()" class="bg-[#224289] hover:bg-[#1b346d] text-white text-xs font-bold py-2 px-4 rounded-lg shadow-sm transition-all">
                    <i class="fa-solid fa-lock"></i> Acceso Editor
                </button>
            </div>

            <div class="relative w-full lg:w-80">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Buscar dependencia o puesto..." class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 pl-10 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-[#224289]">
            </div>
        </div>
    </section>

    <!-- Lienzo Interactivo Principal -->
    <main class="flex-1 p-6 max-w-[1700px] mx-auto w-full flex flex-col">
        <div id="view-chart" class="flex-1 flex flex-col bg-slate-50 rounded-3xl border border-slate-200 shadow-inner overflow-hidden min-h-[650px] relative">
            
            <!-- Controles de Zoom Flotantes -->
            <div class="absolute top-4 left-4 z-20 bg-white p-2 rounded-2xl border border-slate-200 shadow-md flex items-center gap-1.5">
                <button onclick="adjustZoom(0.1)" class="w-9 h-9 bg-slate-50 hover:bg-[#224289] text-slate-600 hover:text-white rounded-xl flex items-center justify-center border border-slate-200 transition-all">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </button>
                <button onclick="adjustZoom(-0.1)" class="w-9 h-9 bg-slate-50 hover:bg-[#224289] text-slate-600 hover:text-white rounded-xl flex items-center justify-center border border-slate-200 transition-all">
                    <i class="fa-solid fa-magnifying-glass-minus"></i>
                </button>
                <button onclick="resetZoomAndPan()" class="w-9 h-9 bg-slate-50 hover:bg-[#224289] text-slate-600 hover:text-white rounded-xl flex items-center justify-center border border-slate-200 transition-all">
                    <i class="fa-solid fa-expand"></i>
                </button>
                <span id="zoom-indicator" class="text-xs text-slate-600 font-bold px-2.5">100%</span>
            </div>

            <!-- Contenedor del Canvas Arrastrable -->
            <div id="tree-container" class="w-full h-full min-h-[600px] overflow-hidden relative flex items-center justify-center canvas-grid">
                <div id="tree-canvas" class="absolute origin-center transition-transform duration-75 ease-out p-12 flex flex-col items-center gap-12" style="transform: translate(0px, 0px) scale(1);">
                    <div id="dynamic-canvas-content" class="w-full flex flex-col items-center gap-12">
                        <!-- Renderizado controlado por JavaScript -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Vista de Lista Alternativa -->
        <div id="view-list" class="hidden bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-md">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase">
                        <th class="py-4 px-6">Sección / Nivel</th>
                        <th class="py-4 px-6">Cargo / Dependencia</th>
                        <th class="py-4 px-6">Responsable Autoridad</th>
                        <th class="py-4 px-6">Contacto Institucional</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-slate-100 text-sm text-slate-700"></tbody>
            </table>
        </div>
    </main>

    <!-- Modal de Edición de Datos -->
    <div id="edit-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-100">
            <div class="bg-[#224289] p-5 text-white flex justify-between items-center">
                <h3 class="font-bold text-base">Modificar Cargo Organizacional</h3>
                <button onclick="closeEditModal()" class="text-white/70 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Nombre del Puesto / Oficina *</label>
                    <input type="text" id="modal-role-name" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-sm focus:ring-2 focus:ring-[#224289] outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Nombre de la Autoridad / Responsable</label>
                    <input type="text" id="modal-input-nombre" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-sm focus:ring-2 focus:ring-[#224289] outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Correo Electrónico Interno</label>
                    <input type="email" id="modal-input-email" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-sm focus:ring-2 focus:ring-[#224289] outline-none">
                </div>
            </div>
            <div class="bg-slate-50 p-5 flex justify-between">
                <button onclick="deleteCurrentPosition()" id="btn-delete-node" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold px-3 py-2 rounded-xl">Eliminar Nodo</button>
                <div class="flex gap-2">
                    <button onclick="closeEditModal()" class="bg-slate-200 text-slate-700 text-xs font-bold px-4 py-2 rounded-xl">Cancelar</button>
                    <button onclick="saveAssignment()" class="bg-[#224289] text-white text-xs font-bold px-5 py-2 rounded-xl">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN DE SEGURIDAD ---
        const ADMIN_PASSWORD = "universidad2026";
        let isAdmin = false;
        let currentLevel = 'general'; 

        // --- ESTRUCTURA DE DATOS UNIFICADA DE LA UNIVERSIDAD ---
        let coreData = {
            divisions: [
                { id: "sec", name: "Secretarías" },
                { id: "fac", name: "Facultades" },
                { id: "inst", name: "Institutos" },
                { id: "lab", name: "Laboratorios" },
                { id: "deptos", name: "Departamentos Centrales" },
                { id: "calidad", name: "Evaluación y Calidad" }
            ],
            generalNodes: [
                { id: "g1", name: "Rectorado", dId: "sec", responsable: "", email: "" },
                { id: "g2", name: "Vicerrectorado", dId: "sec", responsable: "", email: "" },
                { id: "g3", name: "Consejo Superior", dId: "sec", responsable: "", email: "" },
                { id: "sub_sec_acad", name: "Secretaría Académica", dId: "sec", isSubtree: true },

                { id: "sub_sec_ext", name: "Secretaría de Extensión", dId: "sec", isSubtree: true },

                { id: "g4", name: "Secretaría de Rectorado", dId: "sec" },
                { id: "g5", name: "Secretaría de Vicerrectorado", dId: "sec" },
                { id: "sub_fac_eco", name: "Facultad de Ciencias Económicas", dId: "fac", isSubtree: true },
                { id: "sub_fac_der", name: "Facultad de Derecho y Cs. Social", dId: "fac", isSubtree: true },
                { id: "sub_fac_ing", name: "Facultad de Ingeniería", dId: "fac", isSubtree: true },
                { id: "sub_fac_hum", name: "Facultad de Humanidades", dId: "fac", isSubtree: true },
                { id: "sub_fac_arq", name: "Facultad de Arquitectura y Urb.", dId: "fac", isSubtree: true },
                { id: "sub_fac_psi", name: "Facultad de Psicología", dId: "fac", isSubtree: true },
                { id: "g6", name: "Instituto de Gerontología", dId: "inst" },
                { id: "sub_inst_dist", name: "Instituto de Educación a Distancia", dId: "inst", isSubtree: true },
                { id: "g7", name: "Instituto de DDHH", dId: "inst" },
                { id: "g8", name: "Instituto de Estadística", dId: "inst" },
                { id: "g9", name: "Instituto Mixto Economía Social UAA-CAM", dId: "inst" },

                { id: "g11", name: "Laboratorio de Sistemas Inteligentes", dId: "lab" },
                { id: "sub_depto_rrhh", name: "Departamento de Recursos Humanos", dId: "deptos", isSubtree: true },
                { id: "sub_depto_sis", name: "Departamento de Sistemas / Informática", dId: "deptos", isSubtree: true },
                { id: "g12", name: "CPACA (Comisión Autoevaluación)", dId: "calidad" }
            ],
            subTrees: {
                "sub_sec_acad": {
                    title: "Secretaría Académica",
                    divisions: [{id: "sa_1", name: "Gestión y Alumnos"}, {id: "sa_2", name: "Bibliotecas y Apoyo"}],
                    nodes: [
                        { id: "sa_n1", name: "Bedelías", dId: "sa_1" },
                        { id: "sa_n2", name: "Asistente Académico", dId: "sa_1" },
                        { id: "sa_n3", name: "Gestión de Carreras", dId: "sa_1" },
                        { id: "sa_n4", name: "Admisión", dId: "sa_1" },

                        { id: "sa_n10", name: "Bibliotecas MDA, MDP y Dolores", dId: "sa_2" }
                    ]
                },
                "sub_sec_adm": {
                    title: "Secretaría Administrativa",
                    divisions: [{id: "sad_1", name: "Finanzas y Personal"}, {id: "sad_2", name: "Soporte e Infraestructura"}],
                    nodes: [
                        { id: "sad_n1", name: "Proveedores y Compras", dId: "sad_1" },
                        { id: "sad_n2", name: "Gestión Bancaria y Tesorería", dId: "sad_1" },
                        { id: "sad_n3", name: "Cuentas Corrientes Estudiantes", dId: "sad_1" },
                        { id: "sad_n4", name: "Liquidaciones", dId: "sad_1" },
                        { id: "sad_n5", name: "Asesor Legal", dId: "sad_2" },
                        { id: "sad_n6", name: "Coordinador de Infraestructura", dId: "sad_2" },
                        { id: "sad_n7", name: "Personal de Mantenimiento", dId: "sad_2" }
                    ]
                },
                "sub_sec_ext": {
                    title: "Secretaría de Extensión / Articulación",
                    divisions: [{id: "se_1", name: "Bienestar y Cursos"}, {id: "se_2", name: "Articulación y Promoción"}],
                    nodes: [
                        { id: "se_n1", name: "Departamento de Cursos y Actividades de Extensión", dId: "se_1" },
                        { id: "se_n2", name: "Departamento de Bienestar Estudiantil", dId: "se_1" },
                        { id: "se_n3", name: "División Deportes", dId: "se_1" },
                        { id: "se_n4", name: "Departamento de Relaciones Institucionales, Ceremonial y Protocolo", dId: "se_1" },
                        { id: "se_n5", name: "División Becas y Pasantías", dId: "se_1" },
                        { id: "se_n6", name: "Idiomas", dId: "se_1" },
                        { id: "se_n7", name: "Promoción y articulación de servicios de formación", dId: "se_2" },
                        { id: "se_n8", name: "Desarrollo de nuevos proyectos e interinstitucionales", dId: "se_2" },
                        { id: "se_n9", name: "Gestión de procesos intra e interinstitucionales", dId: "se_2" },
                        { id: "se_n10", name: "Asesores de ingreso", dId: "se_2" },
                        { id: "se_n11", name: "Articulación", dId: "se_2" }
                    ]
                },
                "sub_sec_inv": {
                    title: "Secretaría de Investigación",
                    divisions: [{id: "si_1", name: "Líneas de Investigación"}],
                    nodes: [
                        { id: "si_n1", name: "Departamento de Evaluación y Capacitación", dId: "si_1" },

                    ]
                },
                "sub_inst_dist": {
                    title: "Instituto de Educación a Distancia",
                    divisions: [{id: "id_1", name: "Gobierno y Gestión"}, {id: "id_2", name: "Áreas Operativas"}],
                    nodes: [
                        { id: "id_n1", name: "Director/a de Educación a Distancia", dId: "id_1" },
                        { id: "id_n2", name: "Coordinador/a de Educación a Distancia", dId: "id_1" },
                        { id: "id_n3", name: "Consejo Asesor", dId: "id_1" },
                        { id: "id_n4", name: "Área de Docencia (Enseñanza, Materiales y Tutorías)", dId: "id_2" },
                        { id: "id_n5", name: "Área de Tecnología, Innovación y Soporte", dId: "id_2" },
                        { id: "id_n6", name: "Área de Gestión", dId: "id_2" }
                    ]
                },
                "sub_depto_sis": {
                    title: "Departamento de Sistemas",
                    divisions: [{id: "ds_1", name: "Infraestructura y Código"}],
                    nodes: [
                        { id: "ds_n1", name: "Soporte IT", dId: "ds_1" },
                        { id: "ds_n2", name: "Programación y Desarrollo", dId: "ds_1" },
                        { id: "ds_n3", name: "Técnicos", dId: "ds_1" }
                    ]
                },
                "sub_depto_rrhh": {
                    title: "Departamento de Recursos Humanos",
                    divisions: [{id: "rh_1", name: "Gestión Interna"}, {id: "rh_2", name: "Área Docente"}],
                    nodes: [
                        { id: "rh_n1", name: "Atracción y Selección", dId: "rh_1" },
                        { id: "rh_n2", name: "Capacitación y Desarrollo", dId: "rh_1" },
                        { id: "rh_n3", name: "Relaciones Laborales", dId: "rh_1" },
                        { id: "rh_n4", name: "Administración de Personal", dId: "rh_1" },
                        { id: "rh_n5", name: "Coordinación Docentes", dId: "rh_2" },
                        { id: "rh_n6", name: "Divisiones Docentes", dId: "rh_2" }
                    ]
                },
                "sub_fac_eco": { title: "Facultad de Ciencias Económicas", divisions: [{id: "f_1", name: "Gobierno"}, {id: "f_2", name: "Cuerpo Académico y Sedes"}], nodes: getFacultadStandardNodes() },
                "sub_fac_der": { title: "Facultad de Derecho y Ciencias Sociales", divisions: [{id: "f_1", name: "Gobierno"}, {id: "f_2", name: "Cuerpo Académico y Sedes"}], nodes: getFacultadStandardNodes() },
                "sub_fac_ing": { title: "Facultad de Ingeniería", divisions: [{id: "f_1", name: "Gobierno"}, {id: "f_2", name: "Cuerpo Académico y Sedes"}], nodes: getFacultadStandardNodes() },
                "sub_fac_hum": { title: "Facultad de Humanidades", divisions: [{id: "f_1", name: "Gobierno"}, {id: "f_2", name: "Cuerpo Académico y Sedes"}], nodes: getFacultadStandardNodes() },
                "sub_fac_arq": { title: "Facultad de Arquitectura y Urbanismo", divisions: [{id: "f_1", name: "Gobierno"}, {id: "f_2", name: "Cuerpo Académico y Sedes"}], nodes: getFacultadStandardNodes() },
                "sub_fac_psi": { title: "Facultad de Psicología", divisions: [{id: "f_1", name: "Gobierno"}, {id: "f_2", name: "Cuerpo Académico y Sedes"}], nodes: getFacultadStandardNodes() }
            }
        };

        function getFacultadStandardNodes() {
            return [
                { id: "fn1_" + Math.random(), name: "Decano", dId: "f_1" },
                { id: "fn2_" + Math.random(), name: "Vicedecano", dId: "f_1" },
                { id: "fn3_" + Math.random(), name: "Director de Carrera", dId: "f_1" },
                { id: "fn4_" + Math.random(), name: "Secretario Coordinador", dId: "f_1" },
                { id: "fn5_" + Math.random(), name: "Secretarios de Carrera en Sedes", dId: "f_2" },
                { id: "fn6_" + Math.random(), name: "Comisiones (Asuntos Académicos, Extensión e Inv.)", dId: "f_2" },
                { id: "fn7_" + Math.random(), name: "Coordinador Académico", dId: "f_2" },
                { id: "fn8_" + Math.random(), name: "Tutores (Inicio, Trayectoria y Finalización)", dId: "f_2" }
            ];
        }

        // --- MOTOR DE NAVEGACIÓN Y RENDERIZACIÓN DE LIENZO ---
        function renderTree() {
            const canvasContent = document.getElementById('dynamic-canvas-content');
            updateBreadcrumbs();

            if (currentLevel === 'general') {
                let html = `
                    <div class="bg-white border-2 border-[#224289] px-6 py-4 rounded-2xl shadow-md text-center min-w-[260px]">
                        <div class="text-xs font-black uppercase text-slate-400 tracking-wider">Autoridad Máxima</div>
                        <div class="text-base font-bold text-[#224289] mt-0.5">Rectorado UAA</div>
                    </div>
                    <div class="flex flex-wrap lg:flex-nowrap gap-6 items-start justify-center w-full">
                `;

                coreData.divisions.forEach(div => {
                    html += `
                        <div class="bg-slate-100/90 p-4 rounded-2xl border border-slate-200 min-w-[260px] max-w-[300px] flex flex-col gap-3 flex-1">
                            <div class="flex justify-between items-center border-b border-slate-300 pb-2">
                                <span class="text-xs font-black text-slate-700 uppercase tracking-wide">${div.name}</span>
                                ${isAdmin ? `<button onclick="deleteDivision('${div.id}')" class="text-rose-500 hover:text-rose-700 text-xs"><i class="fa-solid fa-trash"></i></button>` : ''}
                            </div>
                            <div class="flex flex-col gap-2.5">
                    `;

                    coreData.generalNodes.forEach(node => {
                        if (node.dId === div.id) {
                            html += buildNodeCard(node);
                        }
                    });

                    if (isAdmin) {
                        html += `<button onclick="addNewNodePrompt('${div.id}')" class="bg-white hover:bg-slate-50 border border-dashed border-slate-300 text-[#224289] font-semibold text-xs py-2 rounded-xl transition">+ Añadir Cargo</button>`;
                    }

                    html += `</div></div>`;
                });
                html += `</div>`;
                canvasContent.innerHTML = html;
            } else {
                const subtree = coreData.subTrees[currentLevel];
                if (!subtree) return;

                let html = `
                    <div class="bg-white border-2 border-[#11caa0] px-6 py-4 rounded-2xl shadow-md text-center min-w-[260px]">
                        <div class="text-xs font-black uppercase text-slate-400 tracking-wider">Estructura Interna</div>
                        <div class="text-base font-bold text-slate-800 mt-0.5">${subtree.title}</div>
                    </div>
                    <div class="flex flex-row gap-8 items-start justify-center w-full">
                `;

                subtree.divisions.forEach(subDiv => {
                    html += `
                        <div class="bg-slate-100/90 p-4 rounded-2xl border border-slate-200 min-w-[280px] flex flex-col gap-3">
                            <div class="border-b border-slate-300 pb-1.5 flex justify-between items-center">
                                <span class="text-xs font-bold text-slate-600 uppercase">${subDiv.name}</span>
                            </div>
                            <div class="flex flex-col gap-2.5">
                    `;
                    subtree.nodes.forEach(node => {
                        if (node.dId === subDiv.id) {
                            html += buildNodeCard(node);
                        }
                    });

                    if (isAdmin) {
                        html += `<button onclick="addNewNodePrompt('${subDiv.id}')" class="bg-white hover:bg-slate-50 border border-dashed border-slate-300 text-[#11caa0] font-semibold text-xs py-2 rounded-xl transition">+ Añadir Cargo</button>`;
                    }

                    html += `</div></div>`;
                });
                html += `</div>`;
                canvasContent.innerHTML = html;
            }
            renderListTable();
        }

        function buildNodeCard(node) {
            return `
                <div class="bg-white p-3.5 rounded-xl shadow-xs border border-slate-200 hover:border-[#224289] transition relative group">
                    <div class="text-xs font-bold text-slate-800">${node.name}</div>
                    <div class="text-[11px] text-[#224289] font-medium mt-1">${node.responsable || '—'}</div>
                    ${node.email ? `<div class="text-[10px] text-slate-400 mt-0.5"><i class="fa-solid fa-envelope"></i> ${node.email}</div>` : ''}
                    
                    <div class="mt-2.5 flex items-center justify-between gap-1">
                        ${node.isSubtree ? `
                            <button onclick="navigateToLevel('${node.id}')" class="bg-blue-50 text-[#224289] text-[10px] font-bold py-1 px-2.5 rounded-lg border border-blue-200 hover:bg-[#224289] hover:text-white transition w-full">
                                <i class="fa-solid fa-folder-tree"></i> Ver Detalle
                            </button>
                        ` : ''}
                        <button onclick="openEditModal('${node.id}')" class="bg-slate-50 text-slate-700 text-[10px] font-bold py-1 px-2.5 rounded-lg border border-slate-200 hover:bg-slate-200 transition ${node.isSubtree ? 'admin-only' : 'w-full'}">
                            <i class="fa-solid fa-user-pen text-amber-500"></i> ${isAdmin ? 'Asignar' : 'Ficha'}
                        </button>
                    </div>
                </div>
            `;
        }

        function navigateToLevel(level) {
            currentLevel = level;
            resetZoomAndPan();
            renderTree();
        }

        function updateBreadcrumbs() {
            const container = document.getElementById('breadcrumbs');
            if (currentLevel === 'general') {
                container.innerHTML = `<span class="text-[#224289]"><i class="fa-solid fa-university"></i> Organigrama General</span>`;
            } else {
                const title = coreData.subTrees[currentLevel]?.title || "Sub-Área";
                container.innerHTML = `
                    <span class="text-slate-400 cursor-pointer hover:underline" onclick="navigateToLevel('general')"><i class="fa-solid fa-university"></i> General</span>
                    <span class="text-slate-300">/</span>
                    <span class="text-[#11caa0] font-bold">${title}</span>
                `;
            }
        }

        // --- SISTEMA DINÁMICO DE ALTAS Y CRUD (ELIMINADO ERRORES DE REFERENCIA) ---
        function addNewDivisionPrompt() {
            const name = prompt("Nombre de la nueva columna o departamento:");
            if (!name) return;
            const newId = "div_" + Date.now();
            
            if (currentLevel === 'general') {
                coreData.divisions.push({ id: newId, name: name });
            } else {
                if (coreData.subTrees[currentLevel]) {
                    coreData.subTrees[currentLevel].divisions.push({ id: newId, name: name });
                }
            }
            saveToStorage();
            renderTree();
        }

        function addNewNodePrompt(divId) {
            const name = prompt("Nombre del cargo o área funcional:");
            if (!name) return;
            const newId = "node_" + Date.now();
            const checkSubtree = confirm("¿Esta tarjeta desplegará su propio sub-organigrama al hacer clic en 'Ver Detalle'? (Aceptar = Sí, Cancelar = No)");

            const nodeObj = { id: newId, name: name, dId: divId, responsable: "", email: "", isSubtree: checkSubtree };

            if (currentLevel === 'general') {
                coreData.generalNodes.push(nodeObj);
            } else {
                coreData.subTrees[currentLevel].nodes.push(nodeObj);
            }

            if (checkSubtree) {
                coreData.subTrees[newId] = { title: name, divisions: [{ id: "sd_" + Date.now(), name: "Áreas Internas" }], nodes: [] };
            }

            saveToStorage();
            renderTree();
        }

        function deleteDivision(divId) {
            if (!confirm("¿Deseas eliminar esta columna y todos los cargos asociados a ella?")) return;
            coreData.divisions = coreData.divisions.filter(d => d.id !== divId);
            coreData.generalNodes = coreData.generalNodes.filter(n => n.dId !== divId);
            saveToStorage();
            renderTree();
        }

        // --- GESTIÓN DE MODAL DE EDICIÓN ---
        let targetEditId = null;
        function openEditModal(nodeId) {
            targetEditId = nodeId;
            let node = findNodeById(nodeId);
            if(!node) return;

            document.getElementById('modal-role-name').value = node.name;
            document.getElementById('modal-input-nombre').value = node.responsable || '';
            document.getElementById('modal-input-email').value = node.email || '';
            
            // Si el modo administrador no está activo, bloquear los inputs para modo visor
            document.getElementById('modal-role-name').disabled = !isAdmin;
            document.getElementById('modal-input-nombre').disabled = !isAdmin;
            document.getElementById('modal-input-email').disabled = !isAdmin;
            document.getElementById('btn-delete-node').style.display = isAdmin ? 'block' : 'none';

            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() { document.getElementById('edit-modal').classList.add('hidden'); }

        function saveAssignment() {
            if(!isAdmin) { closeEditModal(); return; }
            let node = findNodeById(targetEditId);
            if (node) {
                node.name = document.getElementById('modal-role-name').value;
                node.responsable = document.getElementById('modal-input-nombre').value;
                node.email = document.getElementById('modal-input-email').value;
                saveToStorage();
            }
            closeEditModal();
            renderTree();
        }

        function deleteCurrentPosition() {
            if(!isAdmin || !targetEditId) return;
            if(!confirm("¿Estás seguro de eliminar este puesto de la estructura?")) return;

            if (currentLevel === 'general') {
                coreData.generalNodes = coreData.generalNodes.filter(n => n.id !== targetEditId);
            } else {
                coreData.subTrees[currentLevel].nodes = coreData.subTrees[currentLevel].nodes.filter(n => n.id !== targetEditId);
            }
            delete coreData.subTrees[targetEditId]; // Limpiar sub-árbol si existía

            saveToStorage();
            closeEditModal();
            renderTree();
        }

        function findNodeById(nodeId) {
            let node = coreData.generalNodes.find(n => n.id === nodeId);
            if (!node) {
                Object.keys(coreData.subTrees).forEach(k => {
                    let sn = coreData.subTrees[k].nodes.find(n => n.id === nodeId);
                    if (sn) node = sn;
                });
            }
            return node;
        }

        function saveToStorage() { localStorage.setItem('uaa_organigrama_save_v2', JSON.stringify(coreData)); }

        // --- SISTEMA DE DESPLAZAMIENTO (ESTILO GOOGLE MAPS) ---
        let zoomLevel = 1.0; let panX = 0, panY = 0; let isDragging = false; let startX, startY;
        const treeContainer = document.getElementById('tree-container');
        const canvas = document.getElementById('tree-canvas');

        treeContainer.addEventListener('mousedown', (e) => {
            if (e.target.closest('button') || e.target.closest('input') || e.target.closest('#edit-modal')) return;
            isDragging = true; startX = e.clientX - panX; startY = e.clientY - panY;
            treeContainer.style.cursor = 'grabbing';
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return; panX = e.clientX - startX; panY = e.clientY - startY;
            canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
        });
        window.addEventListener('mouseup', () => { isDragging = false; treeContainer.style.cursor = 'grab'; });
        treeContainer.addEventListener('wheel', (e) => { e.preventDefault(); adjustZoom(e.deltaY < 0 ? 0.05 : -0.05); });

        function adjustZoom(amount) {
            zoomLevel = Math.max(0.4, Math.min(1.8, zoomLevel + amount));
            document.getElementById('zoom-indicator').textContent = `${Math.round(zoomLevel * 100)}%`;
            canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
        }
        function resetZoomAndPan() { zoomLevel = 1.0; panX = 0; panY = 0; document.getElementById('zoom-indicator').textContent = "100%"; canvas.style.transform = `translate(0px, 0px) scale(1)`; }

        // --- PANEL CONTROL DE SESIÓN ---
        function promptAdminLogin() {
            if (isAdmin) {
                isAdmin = false; document.body.classList.remove('is-admin');
                document.getElementById('btn-login-status').innerHTML = '<i class="fa-solid fa-lock"></i> Acceso Editor';
                renderTree(); return;
            }
            const pass = prompt("Contraseña de seguridad de la Universidad:");
            if (pass === ADMIN_PASSWORD) {
                isAdmin = true; document.body.classList.add('is-admin');
                document.getElementById('btn-login-status').innerHTML = '<i class="fa-solid fa-unlock text-green-400"></i> Modo Editor Activo';
                renderTree();
            } else if (pass !== null) { alert("Acceso denegado."); }
        }

        // --- BUSCADOR INTERACTIVO ---
        function handleSearch(q) {
            q = q.toLowerCase().trim(); if(!q) { renderTree(); return; }
            document.querySelectorAll('#dynamic-canvas-content .group').forEach(c => {
                if(c.textContent.toLowerCase().includes(q)) { c.classList.add('ring-4', 'ring-amber-400', 'scale-105'); } 
                else { c.classList.remove('ring-4', 'ring-amber-400', 'scale-105'); }
            });
        }

        // --- VISTA ALTERNATIVA EN TABLA ---
        function renderListTable() {
            const tbody = document.getElementById('table-body'); let html = '';
            coreData.generalNodes.forEach(n => {
                html += `<tr><td class="py-3 px-6 text-xs text-slate-400 font-bold">General</td><td class="py-3 px-6 font-bold text-[#224289]">${n.name}</td><td class="py-3 px-6">${n.responsable || '—'}</td><td class="py-3 px-6 text-xs">${n.email || '—'}</td></tr>`;
            });
            Object.keys(coreData.subTrees).forEach(k => {
                const sub = coreData.subTrees[k];
                sub.nodes.forEach(n => {
                    html += `<tr><td class="py-3 px-6 text-xs text-emerald-500 font-bold">${sub.title}</td><td class="py-3 px-6 font-medium text-slate-800">${n.name}</td><td class="py-3 px-6">${n.responsable || '—'}</td><td class="py-3 px-6 text-xs">${n.email || '—'}</td></tr>`;
                });
            });
            tbody.innerHTML = html;
        }

        function switchView(view) {
            document.getElementById('view-chart').style.display = view === 'chart' ? 'flex' : 'none';
            document.getElementById('view-list').style.display = view === 'list' ? 'block' : 'none';
        }

        function exportToJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(coreData, null, 2));
            const dl = document.createElement('a'); dl.setAttribute("href", dataStr); dl.setAttribute("download", "organigrama_uaa.json");
            document.body.appendChild(dl); dl.click(); dl.remove();
        }

        function importFromJSON(e) {
            const file = e.target.files[0]; if (!file) return;
            const r = new FileReader();
            r.onload = function(evt) {
                try {
                    coreData = JSON.parse(evt.target.result);
                    saveToStorage(); renderTree();
                } catch(err) { alert("JSON no válido."); }
            };
            r.readAsText(file);
        }

        window.onload = () => {
            const saved = localStorage.getItem('uaa_organigrama_save_v2');
            if(saved) coreData = JSON.parse(saved);
            renderTree();
        };
    </script>
</body>
</html>
